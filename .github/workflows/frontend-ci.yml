name: React CI/CD

on:
  push:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le repo
        uses: actions/checkout@v4

      - name: 📦 Installer les dépendances
        run: npm install

      - name: ✅ Lancer les tests React
        run: npm test -- --watchAll=false

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le repo
        uses: actions/checkout@v4

      - name: 🔨 Builder l’image Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/BookNestFront:latest .

      - name: 🔑 Se connecter à Docker Hub
        run: echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🚀 Pousser l’image sur Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/BookNestFront:latest

